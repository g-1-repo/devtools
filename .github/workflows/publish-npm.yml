name: Publish to NPM

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        
      - name: Build packages
        run: bun run build
        
      - name: Run tests
        run: bun run test --no-watch
        
      - name: Smart publish workflow package
        working-directory: ./packages/workflow
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION already exists on npm..."
          
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "✅ $PACKAGE_NAME@$PACKAGE_VERSION already exists on npm - skipping publish"
          else
            echo "📦 Publishing $PACKAGE_NAME@$PACKAGE_VERSION to npm..."
            npm publish --provenance --access public
            echo "✅ Successfully published $PACKAGE_NAME@$PACKAGE_VERSION"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Smart publish util package
        working-directory: ./packages/util
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION already exists on npm..."
          
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "✅ $PACKAGE_NAME@$PACKAGE_VERSION already exists on npm - skipping publish"
          else
            echo "📦 Publishing $PACKAGE_NAME@$PACKAGE_VERSION to npm..."
            npm publish --provenance --access public
            echo "✅ Successfully published $PACKAGE_NAME@$PACKAGE_VERSION"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}